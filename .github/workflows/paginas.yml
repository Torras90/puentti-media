name: Guardar paginas
on:
  push:
    branches: [fotos]
    paths: [paginas/lista.txt]
permissions:
  contents: write
jobs:
  guardar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          while read -r nombre url; do
            [ -z "$nombre" ] && continue
            case "$nombre" in \#*) continue;; esac
            curl -sL -A "$UA" "$url" -o "paginas/$nombre.html"
          done < paginas/lista.txt
          git config user.name "puentti-bot"
          git config user.email "puentti-bot@users.noreply.github.com"
          git add paginas && git commit -m "Paginas guardadas" && git push
